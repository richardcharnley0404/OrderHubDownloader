appId: com.orderhub.downloader
productName: OrderHub Downloader
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: assets

# Exclude dev-only directories AND any project-root debris from the packaged
# app. The big offenders are tools/onnx-export/.venv and ../.venv-jax (~5.5 GB
# of Python ML stack used during MUSIQ-SPAQ conversion — not needed at
# runtime).
#
# CRITICAL: the additional patterns below (logs, status files, briefs, jsx
# prototypes, scratch .js, `nul`) guard against a v1.7.0 build-pipeline bug
# where untracked debris in the project root (build/dev/ci/renderer logs,
# test status files, scratch `index.js`, the Windows `nul` redirect leftover)
# was being swept into the asar by `**/*` and then mutating in size DURING
# packaging — producing an asar whose payload byte stream no longer matched
# its header offset table (every src/* file ended up reading bytes from the
# previous file's content, throwing SyntaxError at startup).
files:
  - "**/*"
  - "!tools/**/*"
  - "!docs/**/*"
  - "!.claude/**/*"
  - "!.playwright-mcp/**/*"
  - "!**/*.test.js"
  - "!*.log"
  - "!*-log.txt"
  - "!*-status.txt"
  - "!crash-*.txt"
  - "!nul"
  - "!packaged-*.js"
  - "!OHD_*Brief.md"
  - "!OHD_*.jsx"
  # `assets/` is also our `directories.buildResources` target (the NSIS
  # installer reads its icon from there). electron-builder treats the
  # buildResources directory as build-time only and IMPLICITLY EXCLUDES
  # it from the packaged app, even when the `**/*` glob above would
  # otherwise match it. That's why this explicit positive entry is
  # required: it overrides the implicit buildResources exclusion so
  # that the header logo (`assets/favicon hub.svg` referenced by
  # `src/renderer/index.html`), the tray icon (`assets/favicon hub.png`
  # from tray-manager.js), and the window icon (`assets/icon.ico` from
  # window-manager.js) ship in the asar. v1.7.0/v1.7.1 missed this and
  # the runtime UI ran with default Electron icons.
  - "assets/**/*"
# asarUnpack is mandatory for the models: onnxruntime-node loads them by
# filesystem path and cannot read from inside an asar archive.
extraResources:
  - from: resources/models
    to: models
  - from: THIRD_PARTY_LICENSES.md
    to: THIRD_PARTY_LICENSES.md
asarUnpack:
  - resources/models/**

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icons/icon.ico
  signtoolOptions:
    sign: scripts/sign.js

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

publish:
  provider: generic
  url: https://your-s3-bucket.s3.amazonaws.com/ohd/
